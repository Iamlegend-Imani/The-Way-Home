<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2100" viewBox="0 0 1600 2100" role="img" aria-labelledby="title desc"><title id="title">Astrology 101: How to Read a Birth Chart</title><desc id="desc">The Way Home five-layer birth chart reading guide: what, how, where, with what, so what.</desc><defs><radialGradient id="glow" cx="80%" cy="0%" r="75%"><stop offset="0" stop-color="#78a8dd" stop-opacity=".16"/><stop offset="1" stop-color="#06111f" stop-opacity="0"/></radialGradient><style>.s{font-family:Inter,Arial,sans-serif}.g{font-family:Georgia,serif}.t{fill:#f2ead9}.m{fill:#9cabbc}.a{fill:#f0d28d}.b{fill:#78a8dd}.r{fill:#d491a7}.v{fill:#b79ad8}.n{fill:#9fbd7a}.box{fill:#0d1d31;stroke:#d1a85d;stroke-opacity:.24;stroke-width:1.5}</style></defs><rect width="1600" height="2100" fill="#06111f"/><rect width="1600" height="2100" fill="url(#glow)"/><circle cx="118" cy="126" r="50" fill="none" stroke="#d1a85d" stroke-opacity=".55"/><line x1="118" y1="58" x2="118" y2="194" stroke="#f0d28d" stroke-opacity=".7"/><line x1="50" y1="126" x2="186" y2="126" stroke="#f0d28d" stroke-opacity=".7"/><circle cx="118" cy="126" r="8" fill="#f0d28d"/><text x="210" y="88" class="s a" font-size="16" font-weight="800" letter-spacing="3">GATE III · DECODE · LIBRARY GUIDE</text><text x="210" y="154" class="g a" font-size="64">ASTROLOGY 101:</text><text x="210" y="220" class="g t" font-size="56">HOW TO READ A BIRTH CHART</text><text x="210" y="265" class="s m" font-size="20">A simple framework:</text><text x="410" y="265" class="s a" font-size="20" font-weight="800">WHAT</text><text x="475" y="265" class="s m" font-size="20">→</text><text x="510" y="265" class="s n" font-size="20" font-weight="800">HOW</text><text x="568" y="265" class="s m" font-size="20">→</text><text x="602" y="265" class="s v" font-size="20" font-weight="800">WHERE</text><text x="680" y="265" class="s m" font-size="20">→</text><text x="714" y="265" class="s b" font-size="20" font-weight="800">WITH WHAT</text><text x="835" y="265" class="s m" font-size="20">→</text><text x="870" y="265" class="s r" font-size="20" font-weight="800">SO WHAT?</text><rect x="1110" y="72" width="418" height="206" rx="24" class="box"/><text x="1142" y="118" class="g a" font-size="25">Stop reading random placements.</text><text x="1142" y="160" class="s t" font-size="18">A birth chart is not a collection of labels.</text><text x="1142" y="190" class="s t" font-size="18">It is one interconnected system.</text><text x="1142" y="232" class="s m" font-size="15">Read the pieces in relationship.</text><line x1="72" y1="330" x2="1528" y2="330" stroke="#d1a85d" stroke-opacity=".26"/><text x="800" y="382" text-anchor="middle" class="g a" font-size="34">THE 5 LAYERS OF INTERPRETATION</text>
<g><rect x="72" y="420" width="282" height="500" rx="22" class="box"/><text x="96" y="466" class="g a" font-size="30">01</text><text x="96" y="510" class="g a" font-size="24">PLANET = WHAT</text><line x1="96" y1="536" x2="330" y2="536" stroke="#f0d28d" stroke-opacity=".45"/><text x="96" y="576" class="s t" font-size="17">The psychological function</text><text x="96" y="602" class="s t" font-size="17">or energy that is operating.</text><text x="96" y="654" class="s m" font-size="14">Sun = identity, self-expression</text><text x="96" y="680" class="s m" font-size="14">Moon = emotions, needs</text><text x="96" y="706" class="s m" font-size="14">Mercury = thinking, communication</text><text x="96" y="732" class="s m" font-size="14">Venus = love, values, relationships</text><text x="96" y="758" class="s m" font-size="14">Mars = action, drive, desire</text></g>
<g><rect x="366" y="420" width="282" height="500" rx="22" class="box"/><text x="390" y="466" class="g n" font-size="30">02</text><text x="390" y="510" class="g n" font-size="24">SIGN = HOW</text><line x1="390" y1="536" x2="624" y2="536" stroke="#9fbd7a" stroke-opacity=".45"/><text x="390" y="576" class="s t" font-size="17">How that function naturally</text><text x="390" y="602" class="s t" font-size="17">behaves or expresses itself.</text><text x="390" y="654" class="s m" font-size="14">Mercury in Capricorn:</text><text x="390" y="680" class="s m" font-size="14">practical, structured, strategic,</text><text x="390" y="706" class="s m" font-size="14">disciplined communication.</text></g>
<g><rect x="660" y="420" width="282" height="500" rx="22" class="box"/><text x="684" y="466" class="g v" font-size="30">03</text><text x="684" y="510" class="g v" font-size="24">HOUSE = WHERE</text><line x1="684" y1="536" x2="918" y2="536" stroke="#b79ad8" stroke-opacity=".45"/><text x="684" y="576" class="s t" font-size="17">Where in life that expression</text><text x="684" y="602" class="s t" font-size="17">becomes especially visible.</text><text x="684" y="654" class="s m" font-size="14">6th House:</text><text x="684" y="680" class="s m" font-size="14">work, routines, service, health,</text><text x="684" y="706" class="s m" font-size="14">systems, everyday functioning.</text></g>
<g><rect x="954" y="420" width="282" height="500" rx="22" class="box"/><text x="978" y="466" class="g b" font-size="30">04</text><text x="978" y="510" class="g b" font-size="23">ASPECTS = WITH WHAT</text><line x1="978" y1="536" x2="1212" y2="536" stroke="#78a8dd" stroke-opacity=".45"/><text x="978" y="576" class="s t" font-size="17">How this planet interacts with</text><text x="978" y="602" class="s t" font-size="17">the rest of the chart.</text><text x="978" y="654" class="s m" font-size="14">Conjunction = blends</text><text x="978" y="680" class="s m" font-size="14">Trine = flows easily</text><text x="978" y="706" class="s m" font-size="14">Square = creates friction</text><text x="978" y="732" class="s m" font-size="14">Opposition = polarity</text><text x="978" y="758" class="s m" font-size="14">Sextile = opportunity</text></g>
<g><rect x="1248" y="420" width="280" height="500" rx="22" class="box"/><text x="1272" y="466" class="g r" font-size="30">05</text><text x="1272" y="510" class="g r" font-size="22">WHOLE CHART = SO WHAT?</text><line x1="1272" y1="536" x2="1504" y2="536" stroke="#d491a7" stroke-opacity=".45"/><text x="1272" y="576" class="s t" font-size="17">Synthesize everything.</text><text x="1272" y="602" class="s t" font-size="17">What is the bigger story?</text><text x="1272" y="654" class="s m" font-size="14">Look for repetition, stelliums,</text><text x="1272" y="680" class="s m" font-size="14">element and modality balance,</text><text x="1272" y="706" class="s m" font-size="14">angular houses, rulers, patterns,</text><text x="1272" y="732" class="s m" font-size="14">contradictions, and themes.</text></g>
<line x1="72" y1="960" x2="1528" y2="960" stroke="#d1a85d" stroke-opacity=".26"/><text x="800" y="1015" text-anchor="middle" class="g a" font-size="34">PUTTING IT TOGETHER</text><text x="800" y="1048" text-anchor="middle" class="s b" font-size="16" font-weight="800" letter-spacing="3">MERCURY IN CAPRICORN IN THE 6TH HOUSE</text>
<g><rect x="72" y="1080" width="282" height="300" rx="20" class="box"/><text x="96" y="1122" class="s a" font-size="16" font-weight="800">WHAT</text><text x="96" y="1162" class="g t" font-size="26">Mercury</text><text x="96" y="1202" class="s m" font-size="15">Thinking, learning, language,</text><text x="96" y="1226" class="s m" font-size="15">communication, information</text><text x="96" y="1250" class="s m" font-size="15">processing.</text></g><g><rect x="366" y="1080" width="282" height="300" rx="20" class="box"/><text x="390" y="1122" class="s n" font-size="16" font-weight="800">HOW</text><text x="390" y="1162" class="g t" font-size="26">Capricorn</text><text x="390" y="1202" class="s m" font-size="15">Structured, pragmatic, organizing,</text><text x="390" y="1226" class="s m" font-size="15">strategic, realistic, disciplined.</text></g><g><rect x="660" y="1080" width="282" height="300" rx="20" class="box"/><text x="684" y="1122" class="s v" font-size="16" font-weight="800">WHERE</text><text x="684" y="1162" class="g t" font-size="26">6th House</text><text x="684" y="1202" class="s m" font-size="15">Work, routines, systems, service,</text><text x="684" y="1226" class="s m" font-size="15">health, everyday problem-solving.</text></g><g><rect x="954" y="1080" width="282" height="300" rx="20" class="box"/><text x="978" y="1122" class="s b" font-size="16" font-weight="800">WITH WHAT</text><text x="978" y="1162" class="g t" font-size="26">Aspects</text><text x="978" y="1202" class="s m" font-size="15">Ask what modifies, supports,</text><text x="978" y="1226" class="s m" font-size="15">intensifies, or challenges Mercury.</text></g><g><rect x="1248" y="1080" width="280" height="300" rx="20" class="box"/><text x="1272" y="1122" class="s r" font-size="16" font-weight="800">SO WHAT?</text><text x="1272" y="1162" class="g t" font-size="26">The Story</text><text x="1272" y="1202" class="s m" font-size="15">Does the rest of the chart reinforce</text><text x="1272" y="1226" class="s m" font-size="15">this pattern, complicate it, or</text><text x="1272" y="1250" class="s m" font-size="15">redirect it?</text></g>
<rect x="130" y="1410" width="1340" height="74" rx="18" class="box"/><text x="800" y="1457" text-anchor="middle" class="g t" font-size="24">Planet (What) in Sign (How) in House (Where) + Aspects (With What) = Meaning (So What?)</text><text x="800" y="1550" text-anchor="middle" class="g a" font-size="34">HOW TO READ THE WHOLE CHART</text>
<g><rect x="72" y="1590" width="472" height="160" rx="18" class="box"/><text x="96" y="1632" class="s a" font-size="16" font-weight="800">01 · GET THE BIG PICTURE</text><text x="96" y="1672" class="s m" font-size="15">Note Sun, Moon, and Rising as initial anchors.</text><text x="96" y="1698" class="s m" font-size="15">Do not stop there.</text></g><g><rect x="564" y="1590" width="472" height="160" rx="18" class="box"/><text x="588" y="1632" class="s n" font-size="16" font-weight="800">02 · IDENTIFY REPETITION</text><text x="588" y="1672" class="s m" font-size="15">Repeated signs, houses, elements, modalities,</text><text x="588" y="1698" class="s m" font-size="15">and themes can signal emphasis.</text></g><g><rect x="1056" y="1590" width="472" height="160" rx="18" class="box"/><text x="1080" y="1632" class="s v" font-size="16" font-weight="800">03 · READ PLANETS BY HOUSES</text><text x="1080" y="1672" class="s m" font-size="15">Which life arenas contain the most planetary</text><text x="1080" y="1698" class="s m" font-size="15">activity?</text></g><g><rect x="72" y="1768" width="472" height="160" rx="18" class="box"/><text x="96" y="1810" class="s b" font-size="16" font-weight="800">04 · CHECK ASPECT PATTERNS</text><text x="96" y="1850" class="s m" font-size="15">Notice repeated conjunctions, squares, trines,</text><text x="96" y="1876" class="s m" font-size="15">oppositions, and larger patterns.</text></g><g><rect x="564" y="1768" width="472" height="160" rx="18" class="box"/><text x="588" y="1810" class="s r" font-size="16" font-weight="800">05 · LOOK AT RULERS</text><text x="588" y="1850" class="s m" font-size="15">Study the ruler of the Rising sign and the</text><text x="588" y="1876" class="s m" font-size="15">rulership chain used by your system.</text></g><g><rect x="1056" y="1768" width="472" height="160" rx="18" class="box"/><text x="1080" y="1810" class="s a" font-size="16" font-weight="800">06 · SYNTHESIZE THE STORY</text><text x="1080" y="1850" class="s m" font-size="15">Ask what the repeated pattern means for the</text><text x="1080" y="1876" class="s m" font-size="15">actual human being living the chart.</text></g>
<rect x="72" y="1960" width="920" height="100" rx="20" class="box"/><text x="104" y="2002" class="g a" font-size="26">THE BIG MINDSET SHIFT</text><text x="104" y="2035" class="s t" font-size="16">You are not your Sun sign. You are the unique combination of the whole chart.</text><rect x="1012" y="1960" width="516" height="100" rx="20" class="box"/><text x="1044" y="2002" class="g r" font-size="25">YOU ARE A STORY, NOT A LABEL.</text><text x="1044" y="2035" class="s m" font-size="14">Observe before interpreting. Reflect before believing.</text><text x="800" y="2088" text-anchor="middle" class="s a" font-size="13" font-weight="800" letter-spacing="2">THE WAY HOME · A HUMAN OPERATING SYSTEM FOR CONSCIOUS LIVING</text></svg>